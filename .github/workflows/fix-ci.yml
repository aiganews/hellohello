name: Fix CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Install GitHub CLI
        run: type -p gh >/dev/null || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Run CI triage agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY secret is not configured."
            echo "Automation definition: .cursor/automations/triage-ci-failure.yaml"
            exit 0
          fi
          PROMPT="$(cat .cursor/automations/prompts/triage-ci-failure.md)"
          PROMPT="${PROMPT}

          Workflow run ID: ${{ github.event.workflow_run.id }}
          Workflow run URL: ${{ github.event.workflow_run.html_url }}
          Head SHA: ${{ github.event.workflow_run.head_sha }}"
          agent -p "$PROMPT" --model gpt-5 --force

  autofix:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    needs: triage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Run CI autofix agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          NODE_ENV: test
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY secret is not configured."
            echo "Automation definition: .cursor/automations/autofix-ci-failure.yaml"
            exit 0
          fi
          PROMPT="$(cat .cursor/automations/prompts/autofix-ci-failure.md)"
          PROMPT="${PROMPT}

          Workflow run ID: ${{ github.event.workflow_run.id }}
          Head branch: ${{ github.event.workflow_run.head_branch }}"
          agent -p "$PROMPT" --model gpt-5 --force
