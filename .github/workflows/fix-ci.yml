name: Fix CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Record checkout
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Checkout
          status: ${{ steps.checkout.outcome }}
          order: '1'

      - name: Install Cursor CLI
        id: install-cli
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Record Cursor CLI install
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Install Cursor CLI
          status: ${{ steps.install-cli.outcome }}
          order: '2'

      - name: Install GitHub CLI
        id: install-gh
        run: type -p gh >/dev/null || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Record GitHub CLI install
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Install GitHub CLI
          status: ${{ steps.install-gh.outcome }}
          order: '3'

      - name: Run CI triage agent
        id: agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY secret is not configured."
            echo "Automation definition: .cursor/automations/triage-ci-failure.yaml"
            exit 0
          fi
          PROMPT="$(cat .cursor/automations/prompts/triage-ci-failure.md)"
          PROMPT="${PROMPT}

          Workflow run ID: ${{ github.event.workflow_run.id }}
          Workflow run URL: ${{ github.event.workflow_run.html_url }}
          Head SHA: ${{ github.event.workflow_run.head_sha }}"
          agent -p "$PROMPT" --model gpt-5 --force

      - name: Record triage agent
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Triage Agent
          status: ${{ steps.agent.outcome }}
          order: '4'

      - name: Pipeline visualization
        if: always()
        uses: ./.github/actions/pipeline-render
        with:
          title: Fix CI Pipeline — Triage
          fail-on-error: 'false'

  autofix:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    needs: triage
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Record checkout
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Checkout
          status: ${{ steps.checkout.outcome }}
          order: '1'

      - name: Use Node.js 20.x
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Record setup Node
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Setup Node 20.x
          status: ${{ steps.setup-node.outcome }}
          order: '2'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Record install
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Install
          status: ${{ steps.install.outcome }}
          order: '3'

      - name: Install Cursor CLI
        id: install-cli
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Record Cursor CLI install
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Install Cursor CLI
          status: ${{ steps.install-cli.outcome }}
          order: '4'

      - name: Run CI autofix agent
        id: agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          NODE_ENV: test
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY secret is not configured."
            echo "Automation definition: .cursor/automations/autofix-ci-failure.yaml"
            exit 0
          fi
          PROMPT="$(cat .cursor/automations/prompts/autofix-ci-failure.md)"
          PROMPT="${PROMPT}

          Workflow run ID: ${{ github.event.workflow_run.id }}
          Head branch: ${{ github.event.workflow_run.head_branch }}"
          agent -p "$PROMPT" --model gpt-5 --force

      - name: Record autofix agent
        if: always()
        uses: ./.github/actions/pipeline-step
        with:
          name: Autofix Agent
          status: ${{ steps.agent.outcome }}
          order: '5'

      - name: Pipeline visualization
        if: always()
        uses: ./.github/actions/pipeline-render
        with:
          title: Fix CI Pipeline — Autofix
          fail-on-error: 'false'

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [triage, autofix]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Workflow pipeline visualization
        uses: ./.github/actions/workflow-pipeline-summary
        with:
          title: Fix CI Workflow — Full Pipeline
          exclude-jobs: Pipeline Summary
